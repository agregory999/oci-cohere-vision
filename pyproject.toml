[project]
name = "oci-cohere-vision"
version = "0.1.0"
description = "Local Streamlit dashboard for OCI Cohere Command A Vision analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oci==2.185.2",
    "pillow==11.3.0",
    "python-dotenv==1.1.1",
    "streamlit==1.49.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_lab"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
